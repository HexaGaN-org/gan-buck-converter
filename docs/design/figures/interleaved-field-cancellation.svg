<text x="76" y="803" class="small">Purple ⊙ / ⊗ = magnetic field out of / into the page. Adjacent gaps alternate in polarity.</text>
<rect x="45" y="875" width="725" height="350" rx="20" class="panel"/>
<text x="78" y="927" class="head">B  Zoom in on one D/S pair</text>
<text x="78" y="965" class="small">Equal and opposite currents in nearby conductors</text>
<rect x="290" y="1002" width="46" height="126" rx="12" class="pad"/>
<rect x="503" y="1002" width="46" height="126" rx="12" class="pad"/>
<path d="M313 1019 V1106" class="drain" marker-end="url(#down)"/>
<path d="M526 1108 V1021" class="source" marker-end="url(#up)"/>
<text x="313" y="1157" class="bold" text-anchor="middle">D ↓</text>
<text x="526" y="1157" class="bold" text-anchor="middle">S ↑</text>
<circle cx="415" cy="1060" r="17" class="symbol"/><circle cx="415" cy="1060" r="5" fill="#663a92"/>
<text x="415" y="1200" class="bold" text-anchor="middle">Between: ⊙ + ⊙ reinforce</text>
<text x="77" y="1050" class="small">Outside left:</text>
<text x="77" y="1080" class="bold">⊗ + ⊙</text>
<text x="76" y="1111" class="small">partly cancel</text>
<text x="600" y="1050" class="small">Outside</text>
<text x="600" y="1080" class="small">right:</text>
<text x="600" y="1111" class="bold">⊙ + ⊗</text>
<text x="600" y="1142" class="small">partly cancel</text>
<rect x="800" y="875" width="755" height="350" rx="20" class="panel"/>
<text x="834" y="927" class="head">C  Side view: alternating vias</text>
<text x="834" y="965" class="small">Via currents also create circular magnetic fields.</text>
<rect x="835" y="998" width="685" height="164" fill="#f1f5f7" stroke="#8ba0ac" stroke-width="2" stroke-dasharray="7 6"/>
<text x="846" y="1151" class="small">PCB</text>
