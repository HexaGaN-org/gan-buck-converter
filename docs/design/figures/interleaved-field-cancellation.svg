<text x="835" y="1200" class="small">Each gap: fields add locally. Farther away: partial cancellation.</text>
<text x="52" y="1275" class="small">Design takeaway: close D/S lanes and close opposing vias confine magnetic energy, reducing effective loop inductance.</text>
</svg>