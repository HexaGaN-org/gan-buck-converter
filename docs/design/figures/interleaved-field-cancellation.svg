<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="ttl desc">
<title id="ttl">Interleaved GaN FET drain and source currents and magnetic fields</title>
<desc id="desc">A top-view LGA transistor and PCB copper show alternating drain currents down and source currents up. Magnetic field symbols alternate out of and into the page between lanes. A close-up shows reinforcement between a pair and partial cancellation outside it. A side view shows alternating via currents with the same field pattern.</desc>
<defs>
<marker id="down" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M2 2 L16 10 L2 18" fill="none" stroke="#cb3f36" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="up" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto"><path d="M2 2 L16 10 L2 18" fill="none" stroke="#176eaa" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172e3c}.title{font-size:49px;font-weight:700}.subtitle{font-size:25px;fill:#4e6572}.head{font-size:31px;font-weight:700}.label{font-size:24px}.small{font-size:21px;fill:#435967}.bold{font-size:23px;font-weight:700}.panel{fill:#fff;stroke:#d8e2e8;stroke-width:2}.bus{fill:#f7aa49;stroke:#d28b35;stroke-width:2}.finger{fill:#f7aa49;stroke:#d28b35;stroke-width:2}.pad{fill:#d6dde0;stroke:#45545c;stroke-width:3}.symbol{fill:#fff;stroke:#663a92;stroke-width:4}.drain{stroke:#cb3f36;stroke-width:8;fill:none}.source{stroke:#176eaa;stroke-width:8;fill:none}.guide{stroke:#8ba0ac;stroke-width:2.5;fill:none}
</style></defs>
<rect width="1600" height="1300" fill="#f6f9fb"/>

<text x="55" y="70" class="title">How interleaved GaN pads reduce magnetic field spread</text>
<text x="57" y="111" class="subtitle">The currents do not cancel. Their fields partly cancel outside the closely spaced paths.</text>
<rect x="45" y="155" width="1510" height="690" rx="20" class="panel"/>
