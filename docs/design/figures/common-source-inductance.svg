<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="ttl desc">
<title id="ttl">Common source inductance: shared source return versus Kelvin gate return</title>
<desc id="desc">A left circuit shows power current and gate driver return sharing source inductance, generating an unwanted source voltage during switching. A right circuit shows a separate Kelvin gate return connected at the device source, bypassing the PCB power-source inductance.</desc>
<defs>
<marker id="redArrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="19" refY="12" orient="auto"><path d="M3 3 L19 12 L3 21" fill="none" stroke="#cc443b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></marker>
<marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" refX="19" refY="12" orient="auto"><path d="M3 3 L19 12 L3 21" fill="none" stroke="#2175ac" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172e3c}.title{font-size:48px;font-weight:700}.sub{font-size:25px;fill:#4f6570}.head{font-size:32px;font-weight:700}.label{font-size:23px}.small{font-size:21px;fill:#4a606c}.bold{font-size:23px;font-weight:700}.panel{fill:#fff;stroke:#d7e2e9;stroke-width:2}.wire{stroke:#334f61;stroke-width:5;fill:none;stroke-linejoin:round}.gate{stroke:#2175ac;stroke-width:6;fill:none;stroke-linejoin:round}.power{stroke:#cc443b;stroke-width:7;fill:none;stroke-linejoin:round}.shared{stroke:#823f9e;stroke-width:13;fill:none;stroke-linecap:round}.driver{fill:#e5f2fa;stroke:#2175ac;stroke-width:3}.fet{fill:#eef2f4;stroke:#3d5360;stroke-width:3}.inductor{fill:#faf0fa;stroke:#823f9e;stroke-width:3}.node{fill:#172e3c}.star{fill:#2175ac}
</style></defs>
<rect width="1600" height="1100" fill="#f6f9fb"/>

<text x="55" y="69" class="title" text-anchor="start">Common source inductance: where the unwanted voltage appears</text>
<text x="56" y="110" class="sub" text-anchor="start">The problem is a source-path segment shared by power current and the gate driver return.</text>
<rect x="45" y="150" width="735" height="735" rx="20" class="panel"/>
<rect x="820" y="150" width="735" height="735" rx="20" class="panel"/>
<text x="78" y="207" class="head" text-anchor="start">A  Shared source return</text>
<text x="853" y="207" class="head" text-anchor="start">B  Separate Kelvin return</text>
<text x="78" y="242" class="small" text-anchor="start">Power current flows through the gate return path.</text>
<text x="853" y="242" class="small" text-anchor="start">Gate return connects at the device source node.</text>
<rect x="95" y="373" width="162" height="175" rx="14" class="driver"/>
<text x="176" y="420" class="bold" text-anchor="middle">Gate</text>
<text x="176" y="453" class="bold" text-anchor="middle">driver</text>
<text x="176" y="486" class="small" text-anchor="middle">OUT</text>
<text x="176" y="522" class="small" text-anchor="middle">RET</text>
<rect x="505" y="349" width="130" height="192" rx="15" class="fet"/>
<text x="570" y="430" class="bold" text-anchor="middle">GaN</text>
<text x="570" y="461" class="bold" text-anchor="middle">FET</text>
<text x="570" y="329" class="bold" text-anchor="middle">D</text>
<text x="475" y="450" class="bold" text-anchor="middle">G</text>
<text x="490" y="580" class="bold" text-anchor="end">Sdie</text>
<path d="M570 270 V349" class="wire" />
<path d="M570 541 V628" class="shared" />
<circle cx="570" cy="571" r="8" class="node"/>
<text x="604" y="314" class="label" text-anchor="start">power current</text>
<path d="M570 290 V335" class="power" marker-end="url(#redArrow)"/>
<path d="M257 478 H345" class="gate" />
<rect x="345" y="459" width="76" height="38" rx="7" fill="#fff" stroke="#2175ac" stroke-width="3"/>
<text x="383" y="486" class="bold" text-anchor="middle">Rg</text>
<path d="M421 478 H470 V449 H505" class="gate" marker-end="url(#blueArrow)"/>
<path d="M570 605 V628" class="shared" />
<rect x="490" y="628" width="160" height="85" rx="13" class="inductor"/>
<text x="570" y="663" class="small" text-anchor="middle">shared source</text>
<text x="570" y="694" class="small" text-anchor="middle">inductance</text>
<path d="M570 713 V757 H257 V516" class="gate" />
<circle cx="570" cy="757" r="8" class="node"/>
<text x="602" y="770" class="small" text-anchor="start">PGND</text>
<path d="M570 601 V628" class="power" marker-end="url(#redArrow)"/>
<path d="M570 716 V743" class="power" marker-end="url(#redArrow)"/>
<path d="M290 757 H265" class="gate" marker-end="url(#blueArrow)"/>
<text x="82" y="610" class="small" text-anchor="start">Gate return</text>
<text x="82" y="640" class="small" text-anchor="start">also crosses this</text>
<text x="82" y="670" class="small" text-anchor="start">source path.</text>
<rect x="78" y="799" width="667" height="62" rx="12" fill="#f9eaf0" stroke="#e6bcc8" stroke-width="2"/>
<text x="412" y="839" class="bold" text-anchor="middle">Rising current → source voltage rises → VGS falls</text>
<rect x="865" y="373" width="162" height="175" rx="14" class="driver"/>
<text x="946" y="420" class="bold" text-anchor="middle">Gate</text>
<text x="946" y="453" class="bold" text-anchor="middle">driver</text>
<text x="946" y="486" class="small" text-anchor="middle">OUT</text>
<text x="946" y="522" class="small" text-anchor="middle">RET</text>
<rect x="1275" y="349" width="130" height="192" rx="15" class="fet"/>
<text x="1340" y="430" class="bold" text-anchor="middle">GaN</text>
<text x="1340" y="461" class="bold" text-anchor="middle">FET</text>
<text x="1340" y="329" class="bold" text-anchor="middle">D</text>
<text x="1245" y="450" class="bold" text-anchor="middle">G</text>
<text x="1362" y="580" class="bold" text-anchor="start">Sdie</text>
<path d="M1340 270 V349" class="wire" />
<path d="M1340 541 V605" class="wire" />
<circle cx="1340" cy="571" r="10" class="star"/>
<text x="1374" y="314" class="label" text-anchor="start">power current</text>
<path d="M1340 290 V335" class="power" marker-end="url(#redArrow)"/>
<path d="M1027 478 H1115" class="gate" />
<rect x="1115" y="459" width="76" height="38" rx="7" fill="#fff" stroke="#2175ac" stroke-width="3"/>
<text x="1153" y="486" class="bold" text-anchor="middle">Rg</text>
<path d="M1191 478 H1240 V449 H1275" class="gate" marker-end="url(#blueArrow)"/>
<path d="M1340 571 H1240 V686 H1027 V516" class="gate" />
<path d="M1215 686 H1135" class="gate" marker-end="url(#blueArrow)"/>
<text x="1055" y="628" class="small" text-anchor="start">Kelvin gate return</text>
<text x="1055" y="658" class="small" text-anchor="start">(no power current)</text>
<path d="M1340 605 V628" class="power" />
<rect x="1293" y="628" width="94" height="85" rx="13" fill="#fff1e9" stroke="#cc443b" stroke-width="3"/>
<text x="1340" y="667" class="bold" text-anchor="middle">Lpower</text>
<path d="M1340 713 V757 H1170" class="wire" />
<circle cx="1340" cy="757" r="8" class="node"/>
<text x="1360" y="782" class="small" text-anchor="start">PGND</text>
<path d="M1340 601 V628" class="power" marker-end="url(#redArrow)"/>
<path d="M1340 716 V742" class="power" marker-end="url(#redArrow)"/>
<rect x="853" y="799" width="667" height="62" rx="12" fill="#eaf5fb" stroke="#bfdbe9" stroke-width="2"/>
<text x="1187" y="839" class="bold" text-anchor="middle">PCB power-source voltage stays out of the gate loop</text>
<rect x="45" y="915" width="1510" height="145" rx="20" fill="#edf2f6" stroke="#d7e2e9" stroke-width="2"/>
<text x="78" y="965" class="bold" text-anchor="start">During turn-on (rising power current):</text>
<text x="78" y="1005" class="bold" text-anchor="start">Actual gate voltage ≈ driver command − voltage across the shared source path</text>
<text x="78" y="1040" class="small" text-anchor="start">Example: 1 nH × 2 A/ns = 2 V of unwanted source bounce. Kelvin routing reduces the shared part, not all inductance.</text>
</svg>
