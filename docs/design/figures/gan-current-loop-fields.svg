<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1330" viewBox="0 0 1600 1330" role="img" aria-labelledby="title desc">
<title id="title">Magnetic fields and current loops in an interleaved GaN PCB layout</title>
<desc id="desc">Three panels show antiparallel trace currents viewed from above, opposite via currents viewed from above, and a closed current path between two PCB layers viewed from the side. Fields reinforce in narrow gaps and partly cancel far away; the vertical-plane current loop also contributes inductance.</desc>
<defs>
  <marker id="blueArrow" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="28" refY="17" orient="auto"><path d="M3 3 L28 17 L3 31" fill="none" stroke="#1673b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="orangeArrow" markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" refX="28" refY="17" orient="auto"><path d="M3 3 L28 17 L3 31" fill="none" stroke="#d65c20" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="purpleArrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto"><path d="M2 2 L17 10 L2 18" fill="none" stroke="#7340a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
    .title{font-size:50px;font-weight:700}.subtitle{font-size:25px;fill:#486070}
    .panel{fill:#fff;stroke:#d9e3ea;stroke-width:2}.head{font-size:32px;font-weight:700}
    .label{font-size:23px}.small{font-size:21px;fill:#435967}.em{font-size:23px;font-weight:700;fill:#5c3187}
    .note{font-size:23px;fill:#34515f}.copper{fill:#f3bc88;stroke:#b77941;stroke-width:3}
    .field{stroke:#7340a5;stroke-width:4;fill:none}.dim{stroke:#708698;stroke-width:3;fill:none}
  </style>
</defs>
<rect width="1600" height="1330" fill="#f6f9fb"/>
<text x="60" y="73" class="title">Current loops and magnetic fields in a GaN PCB layout</text>
<text x="61" y="113" class="subtitle">Three views of one idea: keep outgoing current close to its return path.</text>

<!-- Panel A -->
<rect x="45" y="150" width="740" height="485" rx="20" class="panel"/>
<text x="78" y="205" class="head">A  Parallel traces · top view</text>
<text x="78" y="239" class="small">Currents run in opposite directions along adjacent copper.</text>
<rect x="270" y="298" width="74" height="212" rx="9" class="copper"/>
<rect x="480" y="298" width="74" height="212" rx="9" class="copper"/>
<path d="M307 326 V470" stroke="#1673b8" stroke-width="11" marker-end="url(#blueArrow)"/>
<path d="M517 480 V337" stroke="#d65c20" stroke-width="11" marker-end="url(#orangeArrow)"/>
<text x="255" y="542" class="label" fill="#1673b8">I down</text>
<text x="469" y="542" class="label" fill="#d65c20">I up</text>
<!-- field circles in gap -->
<g fill="#7340a5" stroke="#7340a5" stroke-width="3">
  <circle cx="410" cy="335" r="16" fill="none"/><circle cx="410" cy="335" r="5"/>
  <circle cx="410" cy="392" r="16" fill="none"/><circle cx="410" cy="392" r="5"/>
  <circle cx="410" cy="449" r="16" fill="none"/><circle cx="410" cy="449" r="5"/>
</g>
<text x="77" y="331" class="small">Far left:</text>
<text x="77" y="362" class="small">opposing</text>
<text x="77" y="393" class="small">fields partly</text>
<text x="77" y="424" class="small">cancel</text>
<text x="589" y="331" class="small">Far right:</text>
<text x="589" y="362" class="small">opposing</text>
<text x="589" y="393" class="small">fields partly</text>
<text x="589" y="424" class="small">cancel</text>
<path d="M362 577 H461" class="field"/>
<text x="82" y="599" class="em">Between traces: both B fields point out of page (⊙)</text>

<!-- Panel B -->
<rect x="815" y="150" width="740" height="485" rx="20" class="panel"/>
<text x="848" y="205" class="head">B  Vertical vias · top view</text>
<text x="848" y="239" class="small">Here current points into or out of the page.</text>
<!-- concentric field rings -->
<circle cx="1086" cy="402" r="112" class="field"/>
<circle cx="1305" cy="402" r="112" class="field"/>
<circle cx="1086" cy="402" r="82" class="field" opacity="0.65"/>
<circle cx="1305" cy="402" r="82" class="field" opacity="0.65"/>
<!-- left clockwise: top right, right down, bottom left, left up -->
<path d="M1054 289 Q1086 282 1114 291" class="field" marker-end="url(#purpleArrow)"/>
<path d="M1122 319 Q1164 356 1191 399" class="field" marker-end="url(#purpleArrow)"/>
<!-- right counterclockwise: top left, left down -->
<path d="M1336 289 Q1305 282 1276 291" class="field" marker-end="url(#purpleArrow)"/>
<path d="M1269 319 Q1226 356 1200 399" class="field" marker-end="url(#purpleArrow)"/>
<!-- via pads -->
<circle cx="1086" cy="402" r="54" class="copper"/>
<circle cx="1305" cy="402" r="54" class="copper"/>
<circle cx="1086" cy="402" r="25" fill="none" stroke="#7340a5" stroke-width="6"/>
<path d="M1073 389 L1099 415 M1099 389 L1073 415" stroke="#7340a5" stroke-width="6" stroke-linecap="round"/>
<circle cx="1305" cy="402" r="25" fill="none" stroke="#7340a5" stroke-width="6"/>
<circle cx="1305" cy="402" r="8" fill="#7340a5"/>
<text x="1002" y="543" class="label">I into page</text>
<text x="1212" y="543" class="label">I out of page</text>
<text x="868" y="582" class="em">Between vias: both B fields point down (↓)</text>

<text x="868" y="611" class="small">Far from the via pair, their fields partly cancel.</text>

<!-- Panel C -->
<rect x="45" y="670" width="1510" height="585" rx="20" class="panel"/>
<text x="78" y="726" class="head">C  Closed current loop between PCB layers · side view</text>
<text x="78" y="763" class="small">The conducting path can enclose area in a vertical plane. This area also stores magnetic energy.</text>
<!-- layer guides -->
<rect x="278" y="835" width="905" height="38" rx="5" fill="#e2eaf0"/>
<rect x="278" y="1077" width="905" height="38" rx="5" fill="#e2eaf0"/>
<text x="85" y="866" class="label">Top copper layer</text>
<text x="85" y="1108" class="label">Bottom copper layer</text>
<!-- closed copper path; top right, right down, bottom left, left up -->
<path d="M353 855 H1104 V1096 H353 Z" fill="none" stroke="#cb975f" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M570 855 H780" stroke="#d65c20" stroke-width="9" marker-end="url(#orangeArrow)"/>
<path d="M1104 925 V1022" stroke="#d65c20" stroke-width="9" marker-end="url(#orangeArrow)"/>
<path d="M880 1096 H680" stroke="#1673b8" stroke-width="9" marker-end="url(#blueArrow)"/>
<path d="M353 1034 V930" stroke="#1673b8" stroke-width="9" marker-end="url(#blueArrow)"/>
<text x="1015" y="828" class="small">via ↓</text>
<text x="300" y="826" class="small">via ↑</text>
<!-- B into page in loop interior -->
<g stroke="#7340a5" fill="none" stroke-width="4">
  <circle cx="592" cy="974" r="21"/><path d="M579 961 L605 987 M605 961 L579 987"/>
  <circle cx="710" cy="974" r="21"/><path d="M697 961 L723 987 M723 961 L697 987"/>
  <circle cx="828" cy="974" r="21"/><path d="M815 961 L841 987 M841 961 L815 987"/>
</g>
<text x="1248" y="905" class="em">B through loop:</text>
<text x="1248" y="941" class="em">into page (⊗)</text>
<text x="1248" y="991" class="small">All four sides create</text>
<text x="1248" y="1024" class="small">magnetic field.</text>
<!-- height and width dimensions -->
<path d="M1204 851 V1096 M1192 851 H1216 M1192 1096 H1216" class="dim"/>
<text x="1248" y="1103" class="small">h = layer spacing</text>
<path d="M353 1160 H1104 M353 1147 V1173 M1104 1147 V1173" class="dim"/>
<text x="587" y="1197" class="label">w = horizontal loop span</text>
<text x="80" y="1232" class="note">Smaller loop area (approximately w × h) means less field energy and usually less loop inductance.</text>
<text x="80" y="1298" class="small">Orange/blue arrows = current; purple marks = magnetic field. Conceptual, not a specific FET pinout.</text>
</svg>
