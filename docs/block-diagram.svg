</style><text x="30" y="40" class="h">HexaGaN 48 V → 12 V GaN synchronous buck</text><text x="30" y="62" class="s2">Block diagram of the current schematic · 150 W target, 200 W rated · 400 kHz nominal · references as on the schematic</text><rect x="200" y="86" width="1124" height="760" rx="12" fill="none" stroke="#475569" stroke-width="1.4"/><text x="216" y="106" class="f">BUCK CONVERTER PCB · 4 LAYERS · JLCPCB ECONOMIC PCBA, SINGLE-SIDED</text><rect x="20" y="128" width="160" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="32" y="150" class="t" fill="#334155">48 V bench supply</text><text x="32" y="170" class="s">Floating, current-limited</text><rect x="20" y="420" width="160" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="32" y="442" class="t" fill="#334155">5 V bench supply</text><text x="32" y="462" class="s">Bring-up without 48 V</text><rect x="20" y="640" width="160" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="32" y="662" class="t" fill="#334155">Host PC</text><text x="32" y="682" class="s">Telemetry, commands</text><rect x="20" y="750" width="160" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="32" y="772" class="t" fill="#334155">JTAG debugger</text><text x="32" y="792" class="s">XDS110-class</text><rect x="1346" y="128" width="150" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1358" y="150" class="t" fill="#334155">Electronic load</text><text x="1358" y="170" class="s">12 V, up to 16.7 A</text><rect x="226" y="118" width="126" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="238" y="140" class="t" fill="#c2410c">J201 · 48 V in</text><text x="238" y="160" class="s">Screw terminal</text><text x="238" y="177" class="s">40–51 V</text><rect x="392" y="118" width="204" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="404" y="140" class="t" fill="#c2410c">Input protection</text><text x="404" y="160" class="s">F201 7 A fuse · D201 TVS</text><text x="404" y="177" class="s">Q201 reverse-polarity FET</text><text x="404" y="194" class="s">R201 1 mΩ shunt · C203 bulk</text><rect x="636" y="118" width="210" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="648" y="140" class="t" fill="#c2410c">GaN half-bridge</text><text x="648" y="160" class="s">Q301, Q302 IGC033S10S1</text><text x="648" y="177" class="s">U301 LM5113-Q1 driver</text><text x="648" y="194" class="s">C301–C307 input ceramics</text><rect x="890" y="118" width="204" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="902" y="140" class="t" fill="#c2410c">Output filter</text><text x="902" y="160" class="s">L301 6.8 µH</text><text x="902" y="177" class="s">R301 1 mΩ shunt (Kelvin)</text><text x="902" y="194" class="s">C308, C309, C316, C317</text><rect x="1134" y="118" width="170" height="84" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/><text x="1146" y="140" class="t" fill="#c2410c">J301 · 12 V out</text><text x="1146" y="160" class="s">Screw terminal</text><text x="1146" y="177" class="s">12.5 A · LED301 &quot;12V&quot;</text><path d="M180,160 L224,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><path d="M352,160 L390,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><path d="M596,160 L634,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><text x="606" y="150" class="l" fill="#c2410c" text-anchor="start">V_IN</text><path d="M846,160 L888,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><text x="858" y="150" class="l" fill="#c2410c" text-anchor="start">SW</text><path d="M1094,160 L1132,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><path d="M1304,160 L1344,160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#a_pwr)"/><text x="1312" y="150" class="l" fill="#c2410c" text-anchor="start">12 V</text><rect x="392" y="246" width="204" height="70" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="404" y="268" class="t" fill="#0f766e">U201 · aux buck</text><text x="404" y="288" class="s">LM5164, V_IN → 5V_AUX</text><text x="404" y="305" class="s">≈ 150 mA load, 1 A part</text><rect x="636" y="246" width="210" height="124" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/><text x="648" y="268" class="t" fill="#b91c1c">Enable and watchdog</text><text x="648" y="288" class="s">U601 TPS3813 supervisor and</text><text x="648" y="305" class="s">  window watchdog → XRSn</text><text x="648" y="322" class="s">SW601 enable switch</text><text x="648" y="339" class="s">U602–U605 gating, static</text><text x="648" y="356" class="s">  both-high inhibit · LED601</text><rect x="890" y="246" width="204" height="124" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/><text x="902" y="268" class="t" fill="#1d4ed8">Sensing</text><text x="902" y="288" class="s">U403, U405 INA241: both shunts</text><text x="902" y="305" class="s">V_OUT, V_IN dividers with</text><text x="902" y="322" class="s">  TLV9061 buffers</text><text x="902" y="339" class="s">U406, U408 PT1000 RTDs</text><text x="902" y="356" class="s">RC filter on every channel</text><path d="M492,202 L492,244" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><text x="498" y="228" class="l" fill="#0f766e" text-anchor="start">V_IN</text><path d="M741,244 L741,204" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a_en)"/><text x="747" y="228" class="l" fill="#b91c1c" text-anchor="start">HS_PWM / LS_PWM</text><path d="M990,202 L990,244" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a_sig)"/><text x="996" y="228" class="l" fill="#1d4ed8" text-anchor="start">I_SH_OUT, V_OUT</text><text x="1134" y="268" class="l" fill="#1d4ed8">Sensing also takes I_SH_IN</text><text x="1134" y="284" class="l" fill="#1d4ed8">and V_IN from the input</text><text x="1134" y="300" class="l" fill="#1d4ed8">protection block, and the</text><text x="1134" y="316" class="l" fill="#1d4ed8">FET temperatures</text><rect x="226" y="420" width="126" height="64" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="238" y="442" class="t" fill="#0f766e">J202 · 5 V ext</text><text x="238" y="462" class="s">XH header</text><text x="238" y="479" class="s">Q202 rev. prot.</text><rect x="392" y="410" width="204" height="90" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="404" y="432" class="t" fill="#0f766e">U203 · power mux</text><text x="404" y="452" class="s">TPS2121, OV cutoff on J202</text><text x="404" y="469" class="s">+5V → driver, sensing, LDO</text><text x="404" y="486" class="s">5V_AUX takes over if healthy</text><rect x="392" y="540" width="204" height="64" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/><text x="404" y="562" class="t" fill="#0f766e">U202 · 3.3 V LDO</text><text x="404" y="582" class="s">LDL1117, +5V → +3V3</text><text x="404" y="599" class="s">LED202 &quot;POWER&quot;</text><path d="M180,452 L224,452" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><path d="M352,452 L390,452" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><path d="M492,316 L492,408" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><text x="498" y="368" class="l" fill="#0f766e" text-anchor="start">5V_AUX</text><path d="M492,500 L492,538" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><text x="498" y="524" class="l" fill="#0f766e" text-anchor="start">+5V</text><rect x="636" y="420" width="454" height="170" rx="8" fill="#eef2ff" stroke="#1e3a8a" stroke-width="1.6"/><text x="648" y="442" class="t" fill="#1e3a8a">U501 · TMS320F280039C</text><text x="648" y="462" class="s">64-pin LQFP · X501 16 MHz crystal</text><text x="648" y="479" class="s">ePWM with HRPWM → PWM requests to the enable logic</text><text x="648" y="496" class="s">CMPSS trips: overcurrent, output OV, fast input OV</text><text x="648" y="513" class="s">ADC: currents, voltages, FET temperatures</text><text x="648" y="530" class="s">SCI to the USB bridge · JTAG · XRSn reset</text><text x="648" y="547" class="s">LED502 HEARTBEAT · LED501 FAULT</text><path d="M596,572 L634,572" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a_aux)"/><text x="604" y="564" class="l" fill="#0f766e" text-anchor="start">+3V3</text><path d="M650,418 L650,372" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a_en)"/><text x="656" y="391" class="l" fill="#b91c1c">PWM requests,</text><text x="656" y="405" class="l" fill="#b91c1c">MCU_EN, WD kick</text><path d="M832,372 L832,418" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a_en)"/><text x="838" y="391" class="l" fill="#b91c1c">XRSn,</text><text x="838" y="405" class="l" fill="#b91c1c">STAGE_EN_FB</text><path d="M990,372 L990,418" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#a_sig)"/><text x="996" y="400" class="l" fill="#1d4ed8">6 analog channels</text><rect x="226" y="640" width="126" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="238" y="662" class="t" fill="#6d28d9">USBC701</text><text x="238" y="682" class="s">USB-C, D701</text><text x="238" y="699" class="s">USBLC6 ESD</text><rect x="392" y="640" width="204" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="404" y="662" class="t" fill="#6d28d9">U701 · USB-UART</text><text x="404" y="682" class="s">CP2102N bridge</text><rect x="226" y="750" width="126" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/><text x="238" y="772" class="t" fill="#6d28d9">H701 · JTAG</text><text x="238" y="792" class="s">TI 20-pin header</text><path d="M180,672 L224,672" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a_host)"/><path d="M352,672 L390,672" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a_host)"/><path d="M596,672 L696,672 L696,592" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a_host)"/><text x="704" y="640" class="l" fill="#6d28d9" text-anchor="start">SCI</text><path d="M180,782 L224,782" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a_host)"/><path d="M352,782 L786,782 L786,592" fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a_host)"/><text x="794" y="740" class="l" fill="#6d28d9" text-anchor="start">JTAG, XRSn</text><rect x="880" y="630" width="424" height="190" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/><text x="892" y="652" class="t" fill="#334155">Protection layers</text><text x="892" y="672" class="s">Hardware: fuse, TVS and reverse polarity on both inputs;</text><text x="892" y="689" class="s">  J202 overvoltage cutoff in U203</text><text x="892" y="706" class="s">Cycle-by-cycle overcurrent, output overvoltage and fast</text><text x="892" y="723" class="s">  input overvoltage trips in the MCU comparators (CMPSS)</text><text x="892" y="740" class="s">PWM reaches the driver only while SW601 is on, the</text><text x="892" y="757" class="s">  watchdog is kicked and +3V3 is good</text><text x="892" y="774" class="s">Shoot-through: ePWM dead-band (dynamic) plus the</text><text x="892" y="791" class="s">  static both-high inhibit in the enable logic</text><line x1="230" y1="876" x2="264" y2="876" stroke="#c2410c" stroke-width="3"/><text x="272" y="881" class="s">Power path</text><line x1="430" y1="876" x2="464" y2="876" stroke="#0f766e" stroke-width="3"/><text x="472" y="881" class="s">Supply rails</text><line x1="630" y1="876" x2="664" y2="876" stroke="#1d4ed8" stroke-width="3"/><text x="672" y="881" class="s">Analog sense</text><line x1="830" y1="876" x2="864" y2="876" stroke="#b91c1c" stroke-width="3"/><text x="872" y="881" class="s">Enable and PWM</text><line x1="1030" y1="876" x2="1064" y2="876" stroke="#6d28d9" stroke-width="3"/><text x="1072" y="881" class="s">Host and debug</text><rect x="1230" y="868" width="34" height="16" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/><text x="1272" y="881" class="s">Off-board</text></svg>